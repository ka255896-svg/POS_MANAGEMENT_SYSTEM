{% extends "base.html" %}

{% block content %}

<h2>Edit Product</h2>

<div class="card shadow p-4">

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">
        <label>Product Name</label>
        <input type="text"
               name="product_name"
               value="{{ product.product_name }}"
               class="form-control">
    </div>

   <div class="mb-3">
    <label>Quantity</label>

    <input type="number"
           name="quantity"
           value="{{ product.quantity }}"
           class="form-control">
    </div>

    <div class="mb-3">
        <label>Price</label>
        <input type="number"
               step="0.01"
               name="price"
               value="{{ product.price }}"
               class="form-control">
    </div>

   <div class="mb-3">
    <label>Category</label>

    <select name="category" class="form-control">

        {% for category in categories %}

            <option value="{{ category.id }}"
                {% if category.id == product.category.id %}selected{% endif %}>

                {{ category.name }}

            </option>

        {% endfor %}

    </select>
</div>

    <button class="btn btn-primary">
        Update Product
    </button>

    <a href="{% url 'product_list' %}" class="btn btn-secondary">
        Back
    </a>

</form>

</div>

{% endblock %}
