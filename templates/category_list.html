{% extends "base.html" %}

{% block content %}

<h2>Categories</h2>

<a href="{% url 'add_category' %}" class="btn btn-success mb-3">
    Add Category
</a>

<table class="table table-bordered">

<tr>
    <th>ID</th>
    <th>Category Name</th>
    <th>Action</th>
</tr>

{% for category in categories %}

<tr>

    <td>{{ category.id }}</td>

    <td>{{ category.name }}</td>

    <td>
        <a href="{% url 'delete_category' category.id %}"
           class="btn btn-danger btn-sm"
           onclick="return confirm('Delete this category?');">

            Delete

        </a>
    </td>

</tr>

{% empty %}

<tr>
    <td colspan="3">
        No categories available
    </td>
</tr>

{% endfor %}

</table>

{% endblock %}
