{% extends "base.html" %}

{% block content %}

<h2>Add Product</h2>

<div class="card shadow p-4">

<form method="POST">

    {% csrf_token %}


    <div class="mb-3">

        <label class="form-label">
            Product Name
        </label>

        <input
            type="text"
            name="product_name"
            class="form-control"
            required>

    </div>


    <div class="mb-3">

        <label class="form-label">
            Category
        </label>


        <select name="category" class="form-control" required>

            <option value="">
                -- Select Category --
            </option>


            {% for category in categories %}

                <option value="{{ category.id }}">
                    {{ category.name }}
                </option>

            {% endfor %}


        </select>

    </div>
    <div class="mb-3">

    <label>Cost Price</label>

    <input 
        type="number"
        step="0.01"
        name="cost_price"
        class="form-control"
        required>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Price
        </label>

        <input
            type="number"
            step="0.01"
            name="price"
            class="form-control"
            required>

    </div>


    <div class="mb-3">

        <label class="form-label">
            Quantity
        </label>

        <input
            type="number"
            name="quantity"
            class="form-control"
            required>

    </div>


    <button class="btn btn-success">
        Save Product
    </button>


    <a href="{% url 'product_list' %}" 
       class="btn btn-secondary">

        Cancel

    </a>


</form>

</div>


{% endblock %}
