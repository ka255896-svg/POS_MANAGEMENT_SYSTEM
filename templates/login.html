{% extends "base.html" %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h2>
            POS MANAGEMENT SYSTEM
        </h2>

        <p class="subtitle">
            Login to continue
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-danger">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="mb-3">

                <label>
                    Username
                </label>

                <input 
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required>

            </div>


            <div class="mb-3">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>

            </div>


            <button class="btn btn-primary w-100">

                Login

            </button>


        </form>


    </div>

</div>


{% endblock %}
