{% extends "base.html" %}

{% block content %}

<h2>Edit Customer</h2>

<div class="card shadow p-4">

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">
        <label>Full Name</label>
        <input type="text"
               name="full_name"
               value="{{ customer.full_name }}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input type="text"
               name="phone"
               value="{{ customer.phone }}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email"
               name="email"
               value="{{ customer.email }}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label>Address</label>
        <textarea name="address"
                  class="form-control">{{ customer.address }}</textarea>
    </div>

    <button class="btn btn-primary">
        Update Customer
    </button>

    <a href="{% url 'customer_list' %}" class="btn btn-secondary">
        Back
    </a>

</form>

</div>

{% endblock %}
