{% extends "base.html" %}

{% block content %}

<h2>Add Category</h2>

<div class="card shadow p-4">

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">

        <label class="form-label">
            Category Name
        </label>

        <input
            type="text"
            name="name"
            class="form-control"
            required>

    </div>


    <button class="btn btn-success">
        Save Category
    </button>


    <a href="{% url 'category_list' %}"
       class="btn btn-secondary">

        Cancel

    </a>

</form>

</div>


{% endblock %}
