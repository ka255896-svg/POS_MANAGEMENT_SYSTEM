<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     {% load static %}

     <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="bg-dark text-white p-3 vh-100" style="width:250px;">

        <h3>POS System</h3>

        <hr>

        <a href="{% url 'dashboard' %}" class="text-white d-block mb-3 text-decoration-none">
            🏠 Dashboard
        </a>

        <a href="{% url 'product_list' %}" class="text-white d-block mb-3 text-decoration-none">
            📦 Products
        </a>

       <a href="{% url 'category_list' %}" 
         class="text-white d-block mb-3 text-decoration-none">

         📂 Categories

        </a>

        <a href="{% url 'customer_list' %}"
          class="text-white d-block mb-3 text-decoration-none">
             👥 Customers
        </a>

       <a href="{% url 'sales_page' %}" class="text-white d-block mb-3 text-decoration-none">
             🛒 Sales
        </a>

        <a href="{% url 'sales_history' %}" 
            class="text-white d-block mb-3 text-decoration-none">

            📄 Sales History
        </a>
        
       <a href="{% url 'reports' %}"
         class="text-white d-block mb-3 text-decoration-none">
        📊 Reports
        </a>

        <hr>

        <a href="{% url 'login' %}" class="btn btn-danger w-100">
            Logout
        </a>

    </div>

    <!-- Main Content -->

    <div class="container-fluid p-4">

        {% block content %}

        {% endblock %}

    </div>

</div>

</body>
</html>
